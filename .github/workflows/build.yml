name: source-build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\Series4.Desktop.csproj --locked-mode

      - name: Build
        run: dotnet build .\Series4.Desktop.csproj -c Release -p:Platform=x64 --no-restore
